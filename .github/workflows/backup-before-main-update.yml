name: Backup version before main update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  backup-previous-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save previous main as tag and recovery branch
        env:
          BEFORE_SHA: ${{ github.event.before }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous main commit to back up."
            exit 0
          fi

          git cat-file -e "$BEFORE_SHA^{commit}"

          SHORT_SHA="$(printf '%s' "$BEFORE_SHA" | cut -c1-8)"
          TAG="backup/main-before-${RUN_NUMBER}-${SHORT_SHA}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Backup tag already exists: $TAG"
          else
            git tag -a "$TAG" "$BEFORE_SHA" -m "Automatic backup of main before update ${{ github.sha }}"
            git push origin "refs/tags/$TAG"
          fi

          git branch -f backup/latest-before-main-update "$BEFORE_SHA"
          git push --force origin backup/latest-before-main-update
