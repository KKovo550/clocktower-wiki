name: Backup version before main update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  backup-previous-main:
    runs-on: ubuntu-latest
    steps:
      - name: Save previous main with GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous main commit to back up."
            exit 0
          fi

          SHORT_SHA="$(printf '%s' "$BEFORE_SHA" | cut -c1-8)"
          TAG="backup/main-before-${RUN_NUMBER}-${SHORT_SHA}"
          API="https://api.github.com/repos/$REPOSITORY/git/refs"

          echo "Creating permanent backup tag: $TAG"
          status="$(curl -sS -o /tmp/tag.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API" \
            -d "{\"ref\":\"refs/tags/$TAG\",\"sha\":\"$BEFORE_SHA\"}")"

          if [ "$status" != "201" ] && [ "$status" != "422" ]; then
            cat /tmp/tag.json
            exit 1
          fi

          echo "Updating latest recovery branch"
          encoded_ref="heads/backup/latest-before-main-update"
          get_status="$(curl -sS -o /tmp/ref.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API/$encoded_ref")"

          if [ "$get_status" = "200" ]; then
            curl -fsS \
              -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API/$encoded_ref" \
              -d "{\"sha\":\"$BEFORE_SHA\",\"force\":true}"
          else
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API" \
              -d "{\"ref\":\"refs/heads/backup/latest-before-main-update\",\"sha\":\"$BEFORE_SHA\"}"
          fi

          echo "Backup completed for $BEFORE_SHA"
