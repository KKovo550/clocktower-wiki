name: Backup version before main update
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: backup-main
  cancel-in-progress: false
jobs:
  backup-previous-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Save and verify previous main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/backup-main.mjs
